schema_version: 1
groups:
  G1:
    requires_base: false
    selected_base_run: g1_markdown_initial
    selection_reason: >-
      Контроль G1 — исходный Markdown (размер чанка 512 токенов, перекрытие 64).
      В G1 выбран source_map_recursive с границей H4: EC@5 = 0.9700, MRR@10 = 0.9750. У Markdown эти показатели составили 0.841667 и 0.7375, у Recursive — 0.8075 и 0.7450.
      Покрытие улучшилось на 4 вопросах; ухудшений не было. Средний объём первых пяти чанков (raw_tokens@5) — 1099.45 токена против 1930.85 у Markdown.
      Вариант дал 5578 чанков вместо 3175; запуск занял 178.91 с вместо 133.06 с. На этом наборе из 20 эталонных вопросов выигрыш в покрытии оправдывает затраты.
    comparisons:
    - config: configs/experiments/g1_splitters/markdown.yaml
      run: g1_markdown_initial
      reference_run: null
      changed_parameters: []
    - config: configs/experiments/g1_splitters/recursive.yaml
      run: g1_recursive
      reference_run: g1_markdown_initial
      changed_parameters:
      - chunking.strategy
    - config: configs/experiments/g1_splitters/source_map_recursive.yaml
      run: g1_source_map_recursive
      reference_run: g1_markdown_initial
      changed_parameters:
      - chunking.strategy
  G2:
    requires_base: true
    selected_base_run: g1_source_map_recursive
    selection_reason: >-
      В G1 выбран source_map_recursive с границей H4: EC@5 = 0.9700, MRR@10 = 0.9750. У Markdown эти показатели составили 0.841667 и 0.7375, у Recursive — 0.8075 и 0.7450.
      Покрытие улучшилось на 4 вопросах; ухудшений не было. Средний объём первых пяти чанков (raw_tokens@5) — 1099.45 токена против 1930.85 у Markdown.
      Вариант дал 5578 чанков вместо 3175; запуск занял 178.91 с вместо 133.06 с. На этом наборе из 20 эталонных вопросов выигрыш в покрытии оправдывает затраты.
    comparisons:
    - config: configs/experiments/g2_chunks/overlap_128.yaml
      run: g2_overlap_128
      reference_run: g1_source_map_recursive
      changed_parameters:
      - chunking.chunk_overlap
    - config: configs/experiments/g2_chunks/size_768.yaml
      run: g2_size_768
      reference_run: g1_source_map_recursive
      changed_parameters:
      - chunking.chunk_size
  G3:
    requires_base: true
    selected_base_run: g1_source_map_recursive
    selection_reason: >-
      После G2 базой для плотного поиска остался g1_source_map_recursive (H4, размер чанка 512 токенов, перекрытие 64). Его EC@5 = 0.9700, MRR@10 = 0.9750.
      При перекрытии 128 токенов EC@5 осталась равной 0.9700, MRR@10 составила 0.9500, а средний объём контекста вырос с 1099.45 до 1183.9 токена.
      При размере чанка 768 токенов MRR@10 достигла 1.0, но EC@5 снизилась до 0.9100 из-за потерь на multi_01, multi_03 и multi_05. Средний объём контекста — 1352.3 токена, время запуска — 195.59 с.
      Приоритет EC@5 определил выбор исходной конфигурации; оба варианта G5 используют плотный поиск.
    comparisons:
    - config: configs/experiments/g3_search/hybrid.yaml
      run: g3_hybrid
      reference_run: g1_source_map_recursive
      changed_parameters:
      - retrieval.mode
  G4:
    requires_base: true
    selected_base_run: g3_hybrid
    selection_reason: >-
      Оба варианта G4 независимо сравниваются с одной гибридной базой g3_hybrid (H4, размер чанка 512 токенов, перекрытие 64; EC@5 = 0.946667, MRR@10 = 0.9750).
      У плотного контроля EC@5 = 0.9700. Гибридная база выбрана по условиям группы G4, а не из-за преимущества в качестве поиска.
      Вариант BM25 без стемминга не наследует усиленные настройки HNSW. Приведение к нижнему регистру, обработка стоп-слов, число кандидатов и RRF остаются такими же, как у базовой конфигурации.
    comparisons:
    - config: configs/experiments/g4_index/hnsw_32_200_256.yaml
      run: g4_hnsw_32_200_256
      reference_run: g3_hybrid
      changed_parameters:
      - index.hnsw.m
      - index.hnsw.ef_construction
      - retrieval.ef_search
    - config: configs/experiments/g4_index/bm25_no_stem.yaml
      run: g4_bm25_no_stem
      reference_run: g3_hybrid
      changed_parameters:
      - bm25.stemmer
      - bm25.k1
      - bm25.b
  G5:
    requires_base: true
    selected_base_run: g1_source_map_recursive
    selection_reason: >-
      После G2 базой для плотного поиска остался g1_source_map_recursive (H4, размер чанка 512 токенов, перекрытие 64). Его EC@5 = 0.9700, MRR@10 = 0.9750.
      При перекрытии 128 токенов EC@5 осталась равной 0.9700, MRR@10 составила 0.9500, а средний объём контекста вырос с 1099.45 до 1183.9 токена.
      При размере чанка 768 токенов MRR@10 достигла 1.0, но EC@5 снизилась до 0.9100 из-за потерь на multi_01, multi_03 и multi_05. Средний объём контекста — 1352.3 токена, время запуска — 195.59 с.
      Приоритет EC@5 определил выбор исходной конфигурации; оба варианта G5 используют плотный поиск.
    comparisons:
    - config: configs/experiments/g5_headings/title_strip.yaml
      run: g5_title_strip
      reference_run: g1_source_map_recursive
      changed_parameters:
      - embedding.strip_markdown_headings
    - config: configs/experiments/g5_headings/no_title_keep.yaml
      run: g5_no_title_keep
      reference_run: g1_source_map_recursive
      changed_parameters:
      - embedding.include_title
qa_selection:
  run: g1_source_map_recursive
  config: configs/experiments/g1_splitters/source_map_recursive.yaml
  reason: >-
    Выбран плотный поиск с границей H4, размером чанка 512 токенов, перекрытием 64, title=true и strip=false. Сначала сравнивалась EC@5 (у выбранного профиля 0.9700), затем MRR@10 (0.9750).
    Для остальных вариантов пары EC@5 и MRR@10 составили: перекрытие 128 — 0.9700 и 0.9500; размер 768 — 0.9100 и 1.0; гибридный поиск — 0.946667 и 0.9750; изменённый HNSW в G4 — 0.946667 и 0.9750; BM25 без стемминга — 0.9600 и 0.9750; title=false — 0.953333 и 0.9250.
    Удаление заголовков из текста для эмбеддера дало ту же EC@5 на всех 20 вопросах и тот же MRR@10, но средний объём raw_tokens@5 вырос с 1099.45 до 1128.85 токена. EC@10 составила 0.9900 против 0.9700 у контроля, однако в контекст ответа передаётся максимум 5 чанков.
    Поэтому сохранён исходный профиль H4 с меньшим контекстом. Вывод относится только к этим 20 вопросам и не доказывает общей оптимальности или качества ответов LLM.
