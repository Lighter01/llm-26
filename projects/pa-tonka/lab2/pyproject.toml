[project]
name = "dnd-rag"
version = "0.1.0"
description = "D&D book ingestion and Markdown export"
readme = "README.md"
authors = [
    { name = "Lighter01", email = "petrton31@gmail.com" }
]
requires-python = ">=3.13"
dependencies = ["PyYAML>=5.4,<7"]

[dependency-groups]
test = ["pytest>=9,<10", "markdown-it-py>=4,<5"]
lint = ["ruff>=0.15,<0.16"]
dev = []

[tool.ruff]
target-version = "py313"
line-length = 100
include = [
    "src/dnd_rag/ingestion/markdown_export/**/*.py",
    "tests/ingestion/markdown_export/**/*.py",
    "src/dnd_rag/ingestion/question_validation/**/*.py",
    "tests/ingestion/question_validation/**/*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["dnd_rag", "helpers"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = ["src", "tests/ingestion/markdown_export"]
testpaths = ["tests/ingestion/markdown_export", "tests/ingestion/question_validation"]
addopts = "-ra --strict-markers"
cache_dir = ".cache/ingestion/markdown-tests/pytest-cache"
junit_family = "legacy"
markers = ["integration: requires an explicit existing resolved build; never runs the assembler"]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
