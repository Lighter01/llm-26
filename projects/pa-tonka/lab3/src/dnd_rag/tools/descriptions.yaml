search_rules: >-
  Search the local D&D 2024/2025 core rules (XPHB, XDMG, XMM). Returns ranked original
  excerpts with scores, exact source coordinates and stable chunk/index identifiers.
  Use this to ground rules answers. Refine the query if evidence is insufficient.
  limit defaults to 5 and must be between 1 and 10. It does not generate an answer.
