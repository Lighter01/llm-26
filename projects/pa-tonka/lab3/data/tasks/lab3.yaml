      - generate_loot
      history_correctness: true
    rubric:
    - Two level-4 characters, same two Ogres, 900 XP high under 500 / 750 / 1,000.
    - No new treasure roll.
    evidence: []
  - input: What exactly was in the original three purses, and what is our current party and encounter
      difficulty? Recall the recorded result; do not roll again or quote an average.
    expected_tools: []
    checks:
      party_size: 2
      party_level: 4
      difficulty: high
      recall_loot_from_turn: 1
      avoid_tools:
      - generate_loot
      history_correctness: true
    rubric:
    - Money/currency exactly match first loot output.
    - Current party two level-4 characters and high two-Ogre encounter.
    - No generate_loot reroll.
    evidence: []
- id: short_03_hoard_owner_clarification
  metadata:
    type: short_dialogue
    difficulty: medium
    history_dependent: true
  turns:
  - input: Five level-5 adventurers found a hoard jointly owned by two Ogres and a Green Hag. I have not
      designated a leader or owner whose CR should govern it. We want Arcana. Can you generate it? First
      tell me what missing choice is required; do not invent combined CR or assume who leads.
    expected_tools: []
    checks:
      party_size: 5
      party_level: 5
      treasure_theme: arcana
      must_clarify: hoard_owner_or_leader_cr
      avoid_tools:
      - generate_loot
    rubric:
    - Asks for explicit owner/leader CR basis before rolling.
    - Does not sum CR or silently choose strongest creature.
    evidence: []
  - input: The Green Hag is the designated leader. Generate one normal hoard now using our recorded party
      level and theme. Report concrete contents and keep the result.
    expected_tools:
    - lookup_monsters
    - generate_loot
    checks:
      loot:
        kind: hoard
        cr: '3'
        party_level: 5
        treasure_theme: arcana
        count: 1
      answer_matches_tool_loot: true
      remember_loot_as: hag_hoard
      history_correctness: true
    rubric:
    - Green Hag CR 3, party level 5, Arcana, ordinary single hoard.
    - Actual money/items/rarities match output, including legitimate zero items.
    evidence: []
  - input: Write the chest label with the exact contents we just rolled, its CR basis and theme. This
      records that hoard rather than generating another one.
    expected_tools: []
    checks:
      recall_loot_from_turn: 2
      loot_cr: '3'
      treasure_theme: arcana
      avoid_tools:
      - generate_loot
      history_correctness: true
    rubric:
    - Recalls actual turn-2 contents, Green Hag CR 3 and Arcana.
    - No reroll or extra item if output had none.
    evidence: []
- id: short_04_ambiguous_name_then_count
  metadata:
    type: short_dialogue
    difficulty: medium
    history_dependent: true
  turns:
  - input: For four level-2 characters I want one Goblin and two Wolves. Check which supported goblin
      stat block I mean before calculating; I have not chosen between the goblin entries. Do not guess
      just to produce XP.
    expected_tools:
    - lookup_monsters
    checks:
      party_size: 4
      party_level: 2
      must_clarify: ambiguous_goblin_statblock
    rubric:
    - Distinguishes multiple XMM Goblin entries and asks for exact selection.
    - No silent 2014 or arbitrary Goblin substitution.
    evidence: []
  - input: Use Goblin Warrior. Evaluate that exact encounter now and remember it.
    expected_tools:
    - lookup_monsters
    - evaluate_encounter
    checks:
      party_size: 4
      party_level: 2
      monsters:
        Goblin Warrior: 1
        Wolf: 2
      total_xp: 150
      difficulty: low
      history_correctness: true
    rubric:
    - One Goblin Warrior and two Wolves, 150 XP total.
    - Four level-2 characters, low under 400 / 600 / 800.
    evidence: []
  - input: Change only the Wolves to six. Re-evaluate and restate which goblin we settled on; the party
      remains as before.
    expected_tools:
    - evaluate_encounter
    checks:
      party_size: 4
      party_level: 2
      monsters:
        Goblin Warrior: 1
        Wolf: 6
      total_xp: 350
      difficulty: low
      history_correctness: true
    rubric:
    - One Goblin Warrior, six Wolves, four level-2 characters, total 350 XP low.
    - No multiple-monster multiplier.
    evidence: []
- id: long_01_mothbridge_ledger
  metadata:
    type: long_dialogue
    difficulty: hard
    history_dependent: true
    requires_compaction: true
    early_facts_turn: 1
    history_probe_turns:
    - 2
    - 7
    - 8
    - 9
    input_word_count: 1950
    input_char_count: 12598
    compaction_validation: required_live_event_before_final_probe
  turns:
  - input: 'Mothbridge is a neglected forest crossing where charcoal burners pay a toll to a masked messenger.
      The bridge has two intact arches and a collapsed central span, with a temporary timber walkway above
      the water. Oren maintains a rope ferry downstream, but refuses passage after sunset because someone
      cut its guide rope twice. The party can approach by cart road, follow the bank, or negotiate from
      the tollhouse. These descriptions confer no automatic numerical bonus.


      The messenger wants a sealed letter, not the heroes'' deaths. His allies will not pursue beyond
      the old boundary stones. The players want room for conversation or retreat. Mira, our quartermaster,
      carries a brass lantern: remember that story detail, without treating it as a magic item. Keep actual
      treasure separate from the letter or coins depicted in old murals.


      We begin with four level-4 characters. The accepted encounter should be moderate, forest, fey only,
      exactly four creatures, including exactly one Goblin Warrior and no additional copies of that required
      entry. A separate defeated patrol of four Goblin Warriors supplies individual treasure; it is not
      the new encounter and owns no hoard. The first successful build will remain accepted until I explicitly
      replace it.


      Check the required creature, build that encounter, and roll the separate patrol treasure once. Save
      the actual accepted composition and actual payout.


      Give a useful session-preparation answer, normally 200–300 words. Separate verified tool facts,
      original narration and unresolved assumptions. Preserve the accepted plan and actual treasure ledger;
      a comparison is not permission to replace either.'
    expected_tools:
    - lookup_monsters
    - build_encounter
    - generate_loot
    checks:
      party_size: 4
      party_level: 4
      difficulty: moderate
      habitat: forest
      creature_type: fey
      total_count: 4
      required_monsters:
        Goblin Warrior: 1
      loot:
        kind: individual
        cr: 1/4
        count: 4
      answer_matches_tool_loot: true
      remember_encounter_as: accepted
      remember_loot_as: patrol_purses
    rubric:
    - Build has exactly four forest fey, one Goblin Warrior, moderate for four level-4 characters.
    - Separate individual loot CR 1/4 count 4; exact result is retained.
    - Mira carries the brass lantern.
    evidence: []
  - input: 'Oren sends a sketch of the northern approach. A narrow path runs behind the tollhouse, an
      old orchard opens toward the ferry, and a raised causeway reaches the boundary stones. The sketch
      describes player choices; it adds no combatants. The messenger can wait while the party checks the
      letter''s seal. The charcoal burners know travelers'' names but will not join a fight.


      I want terrain to matter as a story choice without claiming the XP budget predicts every tactical
      outcome. A broad approach might permit negotiation; a narrow route may make retreat awkward. Those
      points are table discussion, not numerical modifiers for the tool. If advice depends on a rule,
      distinguish it from narration.


      A fifth player can now attend, at the same level as everyone else. The newcomer has heard only that
      the group must cross before the letter is collected. This changes party size, not the accepted monsters,
      forest/fey restrictions, mandatory count or treasure already rolled. The purse has not been spent.
      Do not create a replacement just to preserve the former difficulty label.


      Re-evaluate the FIRST accepted composition for our updated party. Show the new budgets and category
      while keeping the monsters fixed.


      Give a useful session-preparation answer, normally 200–300 words. Separate verified tool facts,
      original narration and unresolved assumptions. Preserve the accepted plan and actual treasure ledger;
      a comparison is not permission to replace either.'
    expected_tools:
    - evaluate_encounter
    checks:
      party_size: 5
      party_level: 4
      budgets:
        low: 1250
        moderate: 1875
        high: 2500
      reuse_encounter_from_turn: 1
      avoid_tools:
      - build_encounter
      - generate_loot
      history_correctness: true
    rubric:
    - Uses five level-4 characters and exact first accepted monsters.
    - Budgets 1,250 / 1,875 / 2,500; no replacement or reroll.
    evidence: []
  - input: 'The water under the walkway is shallow enough that falling in is a setback rather than another
      planned battle. A rotten barrel contains a harmless theatrical smoke charge left by a troupe. During
      a demonstration, the charge pushes a volunteer from within the messenger''s reach to outside it.
      Exact distance will be decided at the table; assume it is enough to cross the reach boundary.


      The volunteer spends no movement and takes no action, Bonus Action or Reaction to be moved. There
      is no teleportation. The messenger can see the volunteer and still has a Reaction. Those details
      are deliberate: do not answer an easier question by inventing blocked sight, a spent Reaction or
      a Disengage action. We need the actual trigger and the exception relevant to the specified motion.


      The players want a ruling they can reuse when a force pushes or drags someone. A contrasting example
      with ordinary movement may help, but it should stay an example. Do not simulate attacks or introduce
      a custom rule for dramatic explosions. The original accepted encounter and patrol treasure remain
      unchanged; this is a rules consultation between planning decisions.


      Find the 2024 Opportunity Attack rule. Does this specific push provoke, and why?


      Give a useful session-preparation answer, normally 200–300 words. Separate verified tool facts,
      original narration and unresolved assumptions. Preserve the accepted plan and actual treasure ledger;
      a comparison is not permission to replace either.'
    expected_tools:
    - search_rules
    checks:
      rules_answer: specified_forced_movement_does_not_provoke
    rubric:
    - Specified forced movement does not provoke; actual retrieved rule supports the explanation.
    evidence:
    - *id001
  - input: 'Beyond the crossing, two warning posts mark different forest hazards. One has deep claw marks
      and scraps of feathers; the other is covered in torn webbing. Oren suspects travelers confused two
      creatures in their reports. Fair clues should let the players choose whether to investigate, not
      spring a fabricated ability on them. We are not combining both hazards with the accepted confrontation.


