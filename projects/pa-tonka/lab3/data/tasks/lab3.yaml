version: 1
items:
- id: single_01_forest_fey
  metadata:
    type: single
    difficulty: medium
    history_dependent: false
  turns:
  - input: 'Build a moderate forest encounter for four level-3 characters: only fey, exactly four creatures,
      including exactly one Goblin Warrior. First check that stat block. Do not add further copies of
      the required creature. Report the actual composition, XP and party budgets; explain how all restrictions
      are satisfied. A short original scene hook is welcome after the verified facts.'
    expected_tools:
    - lookup_monsters
    - build_encounter
    checks:
      party_size: 4
      party_level: 3
      difficulty: moderate
      habitat: forest
      creature_type: fey
      total_count: 4
      required_monsters:
        Goblin Warrior: 1
      budgets:
        low: 600
        moderate: 900
        high: 1600
    rubric:
    - Uses current XMM Goblin Warrior, not a 2014 goblin.
    - Result contains four forest fey, exactly one Goblin Warrior, and 600 < XP <= 900.
    - Does not report a constraint conflict or search exhaustion as a successful build.
    evidence: []
- id: single_02_mages_budget
  metadata:
    type: single
    difficulty: easy
    history_dependent: false
  turns:
  - input: For four level-6 adventurers, evaluate exactly two Mages from the current Monster Manual. Look
      up Mage first. Show each CR/XP, total XP and all three party budgets. Tell me the 2024 difficulty
      and whether it exceeds high. Explain the budget method from the book; do not redesign the encounter.
    expected_tools:
    - lookup_monsters
    - evaluate_encounter
    - search_rules
    checks:
      party_size: 4
      party_level: 6
      monsters:
        Mage: 2
      total_xp: 4600
      difficulty: high
      exceeds_high: false
      budgets:
        low: 2400
        moderate: 4000
        high: 5600
      avoid_tools:
      - build_encounter
    rubric:
    - Two CR-6 Mages at 2,300 XP give 4,600 XP.
    - High under budgets 2,400 / 4,000 / 5,600, without a 2014 group multiplier.
    - Explains arithmetic using retrieved 2024 encounter guidance.
    evidence:
    - book_id: XDMG
      file: xdmg.md
      relative_path: xdmg.md
      body_hash: 632bd4c59797e852977b63738a2fd96209125f6ceed3a11acbb861adce92c215
      body_sha256: 632bd4c59797e852977b63738a2fd96209125f6ceed3a11acbb861adce92c215
      quote: '***Step 3: Spend Your Budget.*** Every creature has an XP value in its stat block. When
        you add a creature to your combat encounter, deduct its XP from your XP budget to determine how
        many XP you have left to spend. Spend as much of your XP budget as you can without going over.
        It''s OK if you have a few unspent XP left over. Examples are given below:'
      heading_path:
      - 'Chapter 4: Creating Adventures'
      - Plan Encounters
      - Combat Encounters
      - Combat Encounter Difficulty
      start_char: 377391
      end_char: 377743
      line_start: 5005
      line_end: 5005
- id: single_03_forced_movement
  metadata:
    type: single
    difficulty: medium
    history_dependent: false
  turns:
  - input: My four level-2 heroes face one Ogre and two Wolves. Look up those creatures and evaluate that
      exact encounter. During it, an explosion pushes a hero out of the Ogre's reach without the hero
      using movement, an action, Bonus Action or Reaction. Does that push provoke an Opportunity Attack
      under the 2024 rules? Separate arithmetic from the supported rules ruling; do not simulate combat.
    expected_tools:
    - lookup_monsters
    - evaluate_encounter
    - search_rules
    checks:
      party_size: 4
      party_level: 2
      monsters:
        Ogre: 1
        Wolf: 2
      total_xp: 550
      difficulty: moderate
      budgets:
        low: 400
        moderate: 600
        high: 800
      rules_answer: specified_forced_movement_does_not_provoke
    rubric:
    - Ogre 450 XP plus two Wolves at 50 XP = 550 XP, moderate.
    - The specified forced movement does not provoke; explains the actual rule.
    - Does not replace the supplied monsters.
    evidence:
    - &id001
      book_id: XPHB
      file: xphb.md
      relative_path: xphb.md
      body_hash: 3d50513f354f733fc1fee3b5055bc653a7fba5f7c340d97514bed68e364dd2a7
      body_sha256: 3d50513f354f733fc1fee3b5055bc653a7fba5f7c340d97514bed68e364dd2a7
      quote: '***Avoiding Opportunity Attack.*** You can avoid provoking an Opportunity Attack by taking
        the Disengage action. You also don''t provoke an Opportunity Attack when you Teleport or when
        you are moved without using your movement, action, Bonus Action, or Reaction. For example, you
        don''t provoke an Opportunity Attack if an explosion hurls you out of a foe''s reach or if you
        fall past an enemy.'
      heading_path:
      - 'Chapter 1: Playing the Game'
      - Combat
      - Melee Attacks
      - Opportunity Attacks
      start_char: 85636
      end_char: 86027
      line_start: 1205
      line_end: 1205
- id: single_04_patrol_purses
  metadata:
    type: single
    difficulty: easy
    history_dependent: false
  turns:
  - input: Look up Goblin Warrior, then roll individual monetary treasure for a homogeneous patrol of
      six of them using the 2024 table. Explain the procedure from the book and report exactly what the
      tool rolled. This is individual treasure, not a hoard. Do not use the average or roll six unrelated
      purses.
    expected_tools:
    - lookup_monsters
    - generate_loot
    - search_rules
    checks:
      loot:
        kind: individual
        cr: 1/4
        count: 6
        currency: gp
        minimum: 18
        maximum: 108
        multiple_of: 6
      answer_matches_tool_loot: true
    rubric:
    - Uses CR 1/4 and individual count 6.
    - One 3d6 GP roll multiplied by six; actual total matches tool and is 18..108 GP divisible by six.
    - No invented magic items or replacement random total.
    evidence:
    - book_id: XDMG
      file: xdmg.md
      relative_path: xdmg.md
      body_hash: 632bd4c59797e852977b63738a2fd96209125f6ceed3a11acbb861adce92c215
      body_sha256: 632bd4c59797e852977b63738a2fd96209125f6ceed3a11acbb861adce92c215
      quote: You can use the Random Individual Treasure table to determine how much treasure a single
        monster has based on its Challenge Rating (CR). The table includes the average total in parentheses,
        which you can use instead of rolling. To determine the total amount of treasure for a group of
        similar creatures, you can roll once and multiply the total by the number of creatures in the
        group.
      heading_path:
      - 'Chapter 4: Creating Adventures'
      - Adventure Rewards
      - Individual Treasure
      start_char: 396856
      end_char: 397241
      line_start: 5194
      line_end: 5194
- id: single_05_dragon_hoard
  metadata:
    type: single
    difficulty: medium
    history_dependent: false
  turns:
  - input: Our four level-8 adventurers defeated a Young Green Dragon, the sole owner of its hoard. Look
      it up to confirm the CR basis, then generate one ordinary 2024 hoard, Arcana theme, party level
      8. Do not double the treasure. List actual money and every actual magic item with rarity and source.
      Explain from the book why combined encounter CR or XP does not choose the hoard's CR row.
    expected_tools:
    - lookup_monsters
    - generate_loot
    - search_rules
    checks:
      loot:
        kind: hoard
        cr: '8'
        party_level: 8
        treasure_theme: arcana
        count: 1
        currency: gp
        minimum: 800
        maximum: 8000
        item_count_min: 1
        item_count_max: 3
      answer_matches_tool_loot: true
    rubric:
    - Explicit owner is Young Green Dragon, CR 8.
    - Money uses 8d10 x 100 GP; hoard has 1d3 actual items, no doubling.
    - All amounts, names and rarities match actual tool output.
    - Retrieval supports owner/leader CR basis, not summed CR.
    evidence:
    - book_id: XDMG
      file: xdmg.md
      relative_path: xdmg.md
      body_hash: 632bd4c59797e852977b63738a2fd96209125f6ceed3a11acbb861adce92c215
      body_sha256: 632bd4c59797e852977b63738a2fd96209125f6ceed3a11acbb861adce92c215
      quote: Adventurers sometimes discover large caches of treasure, the accumulated wealth of a large
        group of creatures or the belongings of a single powerful creature that hoards valuables. The
        Random Treasure Hoard table can help you create such a cache. When determining the contents of
        a hoard belonging to one monster, use the row for that monster's Challenge Rating (CR). When the
        hoard belongs to a large group of monsters, use the CR of the monster that leads the group. Each
        row includes average results for monetary treasure, which you can use instead of rolling. To create
        a hoard for a monster that is particularly fond of amassing treasure (such as a dragon), you can
        roll twice on the table or roll once and double the total.
      heading_path:
      - 'Chapter 4: Creating Adventures'
      - Adventure Rewards
      - Treasure Hoards
      start_char: 397895
      end_char: 398624
      line_start: 5239
      line_end: 5239
- id: single_06_required_filter_conflict
  metadata:
    type: single
    difficulty: hard
    history_dependent: false
  turns:
  - input: Build a moderate urban encounter for four level-4 heroes, exactly three creatures and undead
      only. Exactly one required creature is an Owlbear; you may not replace it or change its count. Check
      it first. If conditions conflict, explain which decision I need to change. Do not silently relax
      a filter or call a noncompliant encounter successful.
    expected_tools:
    - lookup_monsters
    - build_encounter
    checks:
      party_size: 4
      party_level: 4
      difficulty: moderate
      habitat: urban
      creature_type: undead
      total_count: 3
      required_monsters:
        Owlbear: 1
      expected_status: conflict
      conflict_fields:
      - creature_type
      - habitat
    rubric:
    - Owlbear is a forest monstrosity, conflicting with undead and urban filters.
    - Structured conflict is surfaced; required creature is not removed or replaced.
    evidence: []
