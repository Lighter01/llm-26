    - generate_loot
    - evaluate_encounter
    checks:
      party_size: 4
      party_level: 4
      monsters:
        Ogre: 2
      total_xp: 900
      difficulty: low
      loot:
        kind: individual
        cr: '2'
        count: 3
      answer_matches_tool_loot: true
      remember_loot_as: first_purses
    rubric:
    - CR-2 individual count 3, one 3d6 GP roll multiplied by three.
    - Two Ogres give 900 XP, low under 1,000 / 1,500 / 2,000.
    - Saves actual money.
    evidence: []
  - input: Only two of those characters can attend now. Re-evaluate the same proposed encounter at the
      same level; keep the treasure ledger untouched.
    expected_tools:
    - evaluate_encounter
    checks:
      party_size: 2
      party_level: 4
