      statistics or silently substitute a creature. Independently, evaluate one Wraith and two Skeletons
      for four level-5 characters, looking up those actual creatures as needed. Keep the unresolved boss
      name separate from that concrete evaluation; say what clarification you need.
    expected_tools:
    - lookup_monsters
    - evaluate_encounter
    checks:
      unknown_monster: Azure Cathedral Titan
      party_size: 4
      party_level: 5
      monsters:
        Wraith: 1
        Skeleton: 2
      total_xp: 1900
      difficulty: low
      budgets:
        low: 2000
        moderate: 3000
        high: 4400
    rubric:
    - Unsupported invented boss name is not found; requests exact supported name.
    - No fabricated CR, XP or stat block.
    - Separately evaluates Wraith 1,800 plus two Skeletons at 50 = 1,900 XP, low.
    evidence: []
- id: single_08_fixed_composition_under_target
  metadata:
    type: single
    difficulty: hard
    history_dependent: false
  turns:
  - input: For four level-6 characters, first evaluate two Trolls. Then try to build a HIGH encounter
      with exactly two creatures, both required Trolls. Keep exactly two Trolls with no extra copies or
      replacements. Compare the requested category with the evaluated category. If the fixed composition
      cannot meet high difficulty, say so plainly rather than changing monsters or category.
    expected_tools:
    - lookup_monsters
    - evaluate_encounter
    - build_encounter
    checks:
      party_size: 4
      party_level: 6
      monsters:
        Troll: 2
      total_xp: 3600
      difficulty: moderate
      build_difficulty: high
      total_count: 2
      required_monsters:
        Troll: 2
      build_expected_status:
      - conflict
      - search_exhausted
      budgets:
        low: 2400
        moderate: 4000
        high: 5600
    rubric:
    - 'Two Trolls: 2 x 1,800 = 3,600 XP, moderate.'
    - Fixed two-Troll composition cannot satisfy high.
    - Does not relabel moderate as high, remove a Troll, add a third creature or substitute.
    evidence: []
- id: short_01_required_wight_update
  metadata:
    type: short_dialogue
    difficulty: hard
    history_dependent: true
  turns:
  - input: 'Build a moderate underdark encounter for five level-3 characters: undead only, exactly eight
      creatures, exactly one required Wight. Keep that required count fixed. Give composition, total XP
      and party budgets; remember this as the current encounter.'
    expected_tools:
    - build_encounter
    checks:
      party_size: 5
      party_level: 3
      difficulty: moderate
      habitat: underdark
      creature_type: undead
      total_count: 8
      required_monsters:
        Wight: 1
      budgets:
        low: 750
        moderate: 1125
        high: 2000
      remember_encounter_as: current
    rubric:
    - Exactly eight underdark undead, exactly one Wight, 750 < XP <= 1,125.
    - Actual successful composition is retained.
    evidence: []
  - input: Two players cancelled. Rebuild for the remaining characters at the same level, keeping the
      required creature, habitat, type, exact count and moderate target. Do not remove the mandatory creature
      to make the numbers work; explain any conflict.
    expected_tools:
    - build_encounter
    checks:
      party_size: 3
      party_level: 3
      difficulty: moderate
      habitat: underdark
      creature_type: undead
      total_count: 8
      required_monsters:
        Wight: 1
      expected_status: conflict
      budgets:
        low: 450
        moderate: 675
        high: 1200
      history_correctness: true
    rubric:
    - Infers three remaining level-3 characters and all other constraints.
    - Required Wight costs 700, above moderate budget 675; conflict without weakening.
    evidence: []
  - input: Then accept HIGH difficulty and reduce the total to exactly three creatures. The required creature
      and all other retained restrictions stay in force. Build it and explain the two changes I authorized.
    expected_tools:
    - build_encounter
    checks:
      party_size: 3
      party_level: 3
      difficulty: high
      habitat: underdark
      creature_type: undead
      total_count: 3
      required_monsters:
        Wight: 1
      history_correctness: true
    rubric:
    - Three level-3 characters, exactly three underdark undead, exactly one Wight, 675 < XP <= 1,200.
    - Only target difficulty and creature total were changed.
    evidence: []
