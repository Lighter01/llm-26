  - id: "mm_02"
    question: "What happens when a clay golem is subjected to Acid damage, what condition and die roll trigger Berserk at the start of its turn, and when does Berserk end?"
    reference_answer: |-
      Acid damage deals no damage to the golem; it instead restores HP equal to the Acid damage dealt. Whenever the golem starts its turn Bloodied, roll 1d6: on a 6 it goes berserk. It remains berserk until destroyed or no longer Bloodied.
    answerable: true
    evidence:
      - fact: "Acid Absorption replaces Acid damage to a clay golem with healing equal to the Acid damage dealt."
        alternatives:
          - file: "xmm.md"
            heading_path:
              - "Monsters A to Z"
              - "Clay Golem"
            quote: |-
              > **Acid Absorption.** Whenever the golem is subjected to Acid damage, it takes no damage and instead regains a number of Hit Points equal to the Acid damage dealt.
      - fact: "A clay golem that starts its turn Bloodied goes berserk on a result of 6 on 1d6."
        alternatives:
          - file: "xmm.md"
            heading_path:
              - "Monsters A to Z"
              - "Clay Golem"
            quote: |-
              > **Berserk.** Whenever the golem starts its turn Bloodied, roll 1d6. On a 6, the golem goes berserk. On each of its turns while berserk, the golem attacks the nearest creature it can see. If no creature is near enough to move to and attack, the golem attacks an object. Once the golem goes berserk, it continues to be berserk until it is destroyed or it is no longer Bloodied.
      - fact: "A berserk clay golem remains berserk until destroyed or no longer Bloodied."
        alternatives:
          - file: "xmm.md"
            heading_path:
              - "Monsters A to Z"
              - "Clay Golem"
            quote: |-
