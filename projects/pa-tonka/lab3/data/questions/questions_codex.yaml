  - id: "phb_03"
    question: "For a creature affected by Confusion, what does a result of 1 on the behavior d10 require it to do with its action and movement, and how is its movement direction chosen?"
    reference_answer: |-
      For that turn, the creature takes no action and uses all its movement to move. Roll 1d4 to choose the direction: 1 is north, 2 east, 3 south, and 4 west.
    answerable: true
    evidence:
      - fact: "A Confusion behavior roll of 1 means taking no action and using all movement to move."
        alternatives:
          - file: "xphb.md"
            heading_path:
              - "Chapter 7: Spells"
              - "C"
              - "Confusion"
            quote: |-
              | 1d10 | Behavior for the Turn |
              | --- | --- |
              | 1 | The target doesn't take an action, and it uses all its movement to move. Roll 1d4 for the direction: **1**, north; **2**, east; **3**, south; or **4**, west. |
      - fact: "For a Confusion behavior roll of 1, a separate 1d4 determines direction: 1 north, 2 east, 3 south, and 4 west."
        alternatives:
