  - id: "phb_01"
    question: "How does the Sorcerer's Subtle Spell Metamagic change a spell's component requirements, what is its normal Sorcery Point cost, and which Material components must still be provided?"
    reference_answer: |-
      Subtle Spell normally costs 1 Sorcery Point and lets the Sorcerer cast without Verbal, Somatic, or Material components. Material components are still required if the spell consumes them or specifies a cost for them.
    answerable: true
    evidence:
      - fact: "The normal cost of using Subtle Spell is 1 Sorcery Point."
        alternatives:
          - file: "xphb.md"
            heading_path:
              - "Chapter 3: Character Classes"
              - "Sorcerer"
              - "Level 2: Metamagic Options"
              - "Subtle Spell"
            quote: |-
              #### Subtle Spell

              **Feature Type:** Metamagic

              **Consumes:** Sorcery Point

              *Cost: 1 Sorcery Point*
          - file: "xphb.md"
            heading_path:
              - "Chapter 3: Character Classes"
              - "Sorcerer"
              - "Level 2: Metamagic Options"
              - "Subtle Spell"
            quote: |-
              When you cast a spell, you can spend 1 Sorcery Point to cast it without any Verbal, Somatic, or Material components, except Material components that are consumed by the spell or that have a cost specified in the spell.
      - fact: "Subtle Spell removes Verbal, Somatic, and Material components except consumed Material components or those with a specified cost."
