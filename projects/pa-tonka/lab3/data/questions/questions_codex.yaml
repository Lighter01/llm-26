              ***No Concentration.*** Your Concentration is broken.
  - id: "dmg_01"
    question: "How often does a Bastion turn occur by default, and what happens to orders when its owner is away on that turn? Can communicating with the hirelings through Sending change that outcome?"
    reference_answer: |-
      A Bastion turn occurs every 7 in-game days by default. If the owner is absent, the Bastion acts as though it received the Maintain order for the whole Bastion. This default does not apply if the owner can communicate with the hirelings through Sending or similar magic.
    answerable: true
    evidence:
      - fact: "A Bastion turn occurs every 7 days of in-game time by default."
        alternatives:
          - file: "xdmg.md"
            heading_path:
              - "Chapter 8: Bastions"
              - "Bastion Turns"
              - "Frequency of Bastion Turns"
            quote: |-
              By default, a Bastion turn occurs every 7 days of in-game time. Here are common examples of players taking one or more Bastion turns:
      - fact: "An absent owner causes the whole Bastion to default to Maintain unless the owner can communicate with its hirelings using Sending or similar magic."
        alternatives:
          - file: "xdmg.md"
            heading_path:
              - "Chapter 8: Bastions"
              - "Special Facilities"
              - "Orders"
            quote: |-
              The Maintain order is unusual; it is issued to the whole Bastion rather than to one or more special facilities. If a character isn't in their Bastion on a given Bastion turn, the Bastion acts as though it were issued the Maintain order on that turn unless the owner can communicate with the Bastion hirelings using the *Sending* spell or similar magic.
  - id: "dmg_02"
    question: "A 10-foot-square area of thin ice is carrying 400 pounds. Can any possible tolerance roll let it hold that weight? If a creature with Constitution 14 falls through and can breathe normally, how long before the frigid water starts requiring saves, and what save is required each minute afterward? The creature has no Cold Resistance, Cold Immunity, or natural adaptation to icy water."
    reference_answer: |-
      The ice breaks: its tolerance is 3d10 × 10 pounds, at most 300 pounds. Creatures on the broken ice fall into frigid water. With Constitution 14, the frigid-water rule allows 14 minutes before saves begin; each additional minute requires a DC 10 Constitution saving throw, with 1 Exhaustion level on a failure.
    answerable: true
    evidence:
      - fact: "Thin ice has a tolerance of 3d10 × 10 pounds per 10-foot square and breaks when the weight exceeds that tolerance."
        alternatives:
          - file: "xdmg.md"
            heading_path:
              - "Chapter 3: DM's Toolbox"
              - "Environmental Effects"
              - "Thin Ice"
            quote: |-
              Thin ice has a weight tolerance of 3d10 × 10 pounds per 10-foot-square area. Whenever the total weight on an area of thin ice exceeds its tolerance, the ice in that area breaks.
      - fact: "Creatures on broken thin ice fall through into frigid water."
        alternatives:
          - file: "xdmg.md"
            heading_path:
              - "Chapter 3: DM's Toolbox"
              - "Environmental Effects"
              - "Thin Ice"
            quote: |-
              All creatures on broken ice fall through. Below the ice is frigid water.
      - fact: "A creature can remain immersed in frigid water without ill effects for minutes equal to its Constitution score."
        alternatives:
          - file: "xdmg.md"
            heading_path:
              - "Chapter 3: DM's Toolbox"
              - "Environmental Effects"
              - "Frigid Water"
            quote: |-
              A creature can be immersed in frigid water for a number of minutes equal to its Constitution score before suffering any ill effects.
      - fact: "Each additional minute in frigid water requires a DC 10 Constitution save or causes 1 Exhaustion level; Cold Resistance, Cold Immunity, or natural adaptation grants automatic success."
        alternatives:
          - file: "xdmg.md"
            heading_path:
              - "Chapter 3: DM's Toolbox"
              - "Environmental Effects"
              - "Frigid Water"
            quote: |-
              Each additional minute spent in frigid water requires the creature to succeed on a DC 10 Constitution saving throw or gain 1 Exhaustion level. Creatures with Resistance or Immunity to Cold damage automatically succeed on the save, as do creatures that are naturally adapted to living in ice-cold water.
  - id: "dmg_03"
    question: "When a conflict arises because a bearer acts against a sentient magic item's alignment or purpose, what saving throw does the bearer make and how is its DC calculated?"
    reference_answer: |-
      The bearer makes a Charisma saving throw with a DC of 12 plus the sentient item's Charisma modifier.
    answerable: true
    evidence:
      - fact: "A conflict with a sentient item calls for a Charisma saving throw with DC 12 plus the item's Charisma modifier."
        alternatives:
          - file: "xdmg.md"
            heading_path:
              - "Chapter 7: Treasure"
              - "Magic Items"
              - "Sentient Magic Items"
              - "Conflict"
            quote: |-
              When the bearer of a sentient item acts in a manner opposed to the item's alignment or purpose, conflict can arise. When such a conflict occurs, the item's bearer makes a Charisma saving throw (DC 12 plus the item's Charisma modifier).
  - id: "dmg_04"
    question: "An adventurer finds an unfamiliar computer from another world or time period. What check and DC can identify it, and does success necessarily mean the adventurer can activate or operate it?"
    reference_answer: |-
      Identifying the computer requires a DC 20 Intelligence (Investigation) check because it is complex alien technology. Success does not necessarily establish the ability to use it: the DM may require a separate Intelligence (Investigation) check to activate or operate it.
    answerable: true
    evidence:
      - fact: "Identifying complex alien technology such as a computer requires a DC 20 Intelligence (Investigation) check."
        alternatives:
          - file: "xdmg.md"
            heading_path:
              - "Chapter 3: DM's Toolbox"
              - "Firearms and Explosives"
              - "Alien Technology"
            quote: |-
              When adventurers find a piece of technology that isn't from their world or time period, they can deduce what it is with a successful Intelligence (Investigation) check, with the DC depending on the complexity of the item: DC 10 for a relatively simple item like a calculator or a lighter, or DC 20 for a complex item such as a computer, a chainsaw, or a hovercraft.
      - fact: "The DM may require a separate Intelligence (Investigation) check to determine whether a character can activate or operate alien technology."
        alternatives:
          - file: "xdmg.md"
            heading_path:
              - "Chapter 3: DM's Toolbox"
              - "Firearms and Explosives"
              - "Alien Technology"
            quote: |-
              You may require a separate Intelligence (Investigation) check to determine whether a character can activate or operate the technology; a character who has observed the item in use or has operated a similar item either has Advantage on the check or succeeds on the check automatically (your choice).
