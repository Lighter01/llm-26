  - id: "mm_03"
    question: "How can an ally use Holy Water to end the Unconscious effect of a chasme's Drone, and how long is the affected creature protected against that chasme's Drone after succeeding on its save?"
    reference_answer: |-
      A creature within 5 feet of the affected target can take an action to empty a flask of Holy Water on it, making the target automatically succeed on its save. A successful save grants immunity to that particular chasme's Drone for 24 hours.
    answerable: true
    evidence:
      - fact: "A creature within 5 feet can take an action to empty a flask of Holy Water on a Drone target, causing that target to succeed automatically on its save."
        alternatives:
          - file: "xmm.md"
            heading_path:
              - "Monsters A to Z"
              - "Chasme"
            quote: |-
              > **Drone.** *Constitution Saving Throw:* DC 12, each creature in a 30-foot Emanation originating from the chasme (demons automatically succeed on this save). *Failure:* The target has the Unconscious condition and repeats the save at the end of each of its turns. The target succeeds automatically after 10 minutes or if it takes damage or a creature within 5 feet of it takes an action to empty a flask of Holy Water on it. *Success:* The target is immune to this chasme's Drone for 24 hours.
      - fact: "Success on the save grants immunity to that chasme's Drone for 24 hours."
        alternatives:
          - file: "xmm.md"
            heading_path:
              - "Monsters A to Z"
              - "Chasme"
            quote: |-
              > **Drone.** *Constitution Saving Throw:* DC 12, each creature in a 30-foot Emanation originating from the chasme (demons automatically succeed on this save). *Failure:* The target has the Unconscious condition and repeats the save at the end of each of its turns. The target succeeds automatically after 10 minutes or if it takes damage or a creature within 5 feet of it takes an action to empty a flask of Holy Water on it. *Success:* The target is immune to this chasme's Drone for 24 hours.
  - id: "mm_04"
    question: "A rust monster uses Antennae on a nonmagical metal weapon carried by a creature within 5 feet. What save is required, what weapon penalty follows a failed save, at what penalty is the weapon destroyed, and what spell removes the penalty?"
    reference_answer: |-
      The carrier makes a DC 11 Dexterity saving throw. On failure, the weapon takes a -1 penalty to its attack rolls. The weapon is destroyed when the penalty reaches -5. Casting Mending on the weapon removes the penalty.
    answerable: true
    evidence:
