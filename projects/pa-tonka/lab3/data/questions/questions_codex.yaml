  - id: "phb_04"
    question: "What bonus can consulting an accurate nonfiction Book grant to an Intelligence check, and which skills and subject matter qualify?"
    reference_answer: |-
      It grants a +5 bonus to Intelligence checks using Arcana, History, Nature, or Religion, provided the check concerns the topic of the accurate nonfiction Book being consulted.
    answerable: true
    evidence:
      - fact: "Consulting an accurate nonfiction Book grants +5 to Intelligence (Arcana, History, Nature, or Religion) checks about its topic."
        alternatives:
          - file: "xphb.md"
            heading_path:
              - "Chapter 6: Equipment"
              - "Adventuring Gear"
              - "Book (25 GP)"
            quote: |-
              ### Book (25 GP)

              A Book contains fiction or nonfiction. If you consult an accurate nonfiction Book about its topic, you gain a +5 bonus to Intelligence (Arcana, History, Nature, or Religion) checks you make about that topic.
  - id: "phb_05"
    question: "A spellcaster maintaining Concentration takes 23 damage from one source. What saving throw and DC are required to keep Concentration? If the caster subsequently becomes Incapacitated, can another successful save preserve Concentration? Assume no special feature changes the normal rules."
    reference_answer: |-
      The damage requires a DC 11 Constitution saving throw: half of 23 rounded down is 11, which is higher than 10. Becoming Incapacitated ends Concentration automatically; another saving throw cannot preserve it.
    answerable: true
    evidence:
      - fact: "Damage requires a Constitution save to maintain Concentration, with DC equal to the higher of 10 and half the damage rounded down, capped at 30."
        alternatives:
          - file: "xphb.md"
            heading_path:
              - "Rules Glossary"
              - "Rules Definitions"
              - "Concentration"
            quote: |-
              ***Damage.*** If you take damage, you must succeed on a Constitution saving throw to maintain Concentration. The DC equals 10 or half the damage taken (round down), whichever number is higher, up to a maximum DC of 30.
      - fact: "The Incapacitated condition breaks Concentration automatically."
        alternatives:
          - file: "xphb.md"
            heading_path:
              - "Rules Glossary"
              - "Rules Definitions"
              - "Concentration"
            quote: |-
              ***Incapacitated or Dead.*** Your Concentration ends if you have the Incapacitated condition or you die.
          - file: "xphb.md"
            heading_path:
              - "Chapter 1: Playing the Game"
              - "Conditions"
              - "Incapacitated"
            quote: |-
              ### Incapacitated

              While you have the Incapacitated condition, you experience the following effects.

              ***Inactive.*** You can't take any action, Bonus Action, or Reaction.

              ***No Concentration.*** Your Concentration is broken.
          - file: "xphb.md"
