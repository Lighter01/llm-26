  - id: "phb_02"
    question: "A Medium adventurer starts with no Exhaustion and drinks only one-quarter gallon of water during a day. How many Exhaustion levels do they gain at the end of that day, and how many remain after they subsequently drink their full daily water requirement and finish a Long Rest? Assume no additional Exhaustion is gained and no special features or magic change these rules."
    reference_answer: |-
      They gain 1 Exhaustion level: a Medium creature needs 1 gallon per day, and one-quarter gallon is less than half that amount. Drinking the full daily requirement allows the dehydration level to be removed; it does not remove the level by itself. The subsequent Long Rest removes 1 level, leaving 0.
    answerable: true
    evidence:
      - fact: "A Medium creature requires 1 gallon of water per day."
